
# Test profile: unit/web tests do not require MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.seed.enabled=false
app.currency.migrate-usd-to-inr=false
app.images.migrate=false

app.admin.email=admin@test.local
app.admin.password=AdminTestPass123!

app.alerts.check-interval-ms=86400000

security.jwt.secret=test-secret-key-for-unit-tests-only-0123456789abcdef
security.jwt.expiration-ms=3600000

