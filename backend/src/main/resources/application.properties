
# ============================================================
# ElectroVerse Backend Configuration
# ============================================================

server.port=${SERVER_PORT:8080}
spring.application.name=electroverse

# ---------- MySQL Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electroverse}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# ---------- SQL Initialization ----------
spring.sql.init.mode=never

# ---------- JWT Security ----------
security.jwt.secret=${JWT_SECRET:dev-only-electroverse-secret-key-change-me-please-0123456789}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------- Admin Bootstrap ----------
app.admin.email=${ADMIN_EMAIL:admin@electroverse.local}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Development Seed Data ----------
app.seed.enabled=${SEED_ENABLED:true}

# ---------- Product Image Migration ----------
app.images.migrate=${IMAGE_MIGRATE:true}

# ---------- Currency ----------
app.currency.default=INR
app.currency.migrate-usd-to-inr=${CURRENCY_MIGRATE_USD_TO_INR:true}

# ---------- OpenAPI / Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Logging ----------
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
