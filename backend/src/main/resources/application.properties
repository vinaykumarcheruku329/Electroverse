# ============================================================
# ElectroVerse Backend configuration
# Values are environment-overridable. Never commit real secrets.
# ============================================================
server.port=${SERVER_PORT:8080}

spring.application.name=electroverse

# ---------- Datasource (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electroverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Do not run schema.sql automatically (schema is managed by JPA in dev).
spring.sql.init.mode=never

# ---------- JWT ----------
# Required. Must be set via environment; the app fails fast if missing or shorter than 256 bits.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------- Initial admin bootstrap (see README) ----------
app.admin.email=${ADMIN_EMAIL:admin@electroverse.local}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Seed data (development only) ----------
app.seed.enabled=${SEED_ENABLED:true}

# ---------- Product images ----------
# One-time idempotent correction of random/placeholder product image URLs to
# bundled device assets (/images/products/*.svg). Never touches admin URLs.
app.images.migrate=${IMAGE_MIGRATE:true}

# ---------- Currency ----------
# Default storefront currency for ElectroVerse.
app.currency.default=INR
# One-time conversion of legacy USD records to INR at a documented rate (idempotent).
app.currency.migrate-usd-to-inr=${CURRENCY_MIGRATE_USD_TO_INR:true}

# ---------- OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=INFO
